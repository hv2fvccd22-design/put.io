<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resume for put.io</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https:; media-src https: blob:; worker-src 'self' blob:; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<script src="hls.min.js"></script>
<meta name="theme-color" content="#0f1416">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* Layout: single column, a file list that swaps for a full-width player. Dark first. */
  :root {
    --bg: #0f1416;
    --surface: #171f22;
    --surface-2: #1f292d;
    --line: #2a373c;
    --fg: #e6edef;
    --muted: #8da0a6;
    --accent: #7fd1b9;
    --accent-ink: #08201a;
    --warn: #f0b36a;
    --bad: #f08a80;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f2f6f6;
      --surface: #ffffff;
      --surface-2: #e6eeee;
      --line: #cfdcdc;
      --fg: #11201f;
      --muted: #566b6b;
      --accent: #0f7a63;
      --accent-ink: #ffffff;
      --warn: #8a5a10;
      --bad: #b3261e;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 0 10px;
  }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 650; letter-spacing: .01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button, .btn {
    font: inherit; color: var(--fg);
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 14px; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
  }
  button:hover, .btn:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 650; }
  button.ghost { background: transparent; }
  button:focus-visible, .btn:focus-visible, input:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=password], input[type=text] {
    width: 100%; font: inherit; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px;
  }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .muted { color: var(--muted); }
  .small { font-size: .875rem; }
  .err { color: var(--bad); }
  ol.steps { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }

  .crumbs { display: flex; flex-wrap: wrap; gap: 4px 6px; padding: 4px 0 12px; font-size: .9rem; color: var(--muted); }
  .crumbs button { background: none; border: 0; padding: 2px 4px; color: var(--accent); border-radius: 4px; }
  .crumbs span.sep { opacity: .6; }
  .crumbs .here { color: var(--fg); padding: 2px 4px; }

  .list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .row {
    display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto auto; align-items: center; gap: 10px;
    padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line);
    background: none; border-radius: 0; text-align: left; width: 100%;
  }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--surface-2); }
  .kind { font-size: .68rem; font-weight: 700; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 3px 0; text-align: center; }
  .kind.vid { color: var(--accent); border-color: var(--accent); }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .meta .resume { color: var(--accent); display: block; }
  .dl { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; margin: -6px -8px -6px 0; border: 1px solid var(--line); border-radius: 8px; color: var(--accent); font-size: 1.1rem; }
  .dl:hover { border-color: var(--accent); }
  .dl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .del { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; margin: -6px -8px -6px 0; border: 1px solid var(--line); border-radius: 8px; color: var(--bad); font-size: 1rem; }
  .del:hover { border-color: var(--bad); }
  .del:focus-visible { outline: 2px solid var(--bad); outline-offset: 2px; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }

  video { width: 100%; max-height: 62vh; background: #000; border-radius: 10px; display: block; }
  .ptitle { font-size: 1.05rem; font-weight: 650; margin: 14px 0 4px; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .subsel { font: inherit; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 100%; min-width: 0; flex: 1 1 160px; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; padding: 0 4px; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
  .status { margin-top: 12px; font-size: .875rem; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.4em; }
  .status.bad { color: var(--bad); }
  .status.warn { color: var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button id="back" class="ghost" hidden aria-label="Back">&larr; Back</button>
    <h1 id="title">Resume for put.io</h1>
    <button id="signout" class="ghost small" hidden>Sign out</button>
  </header>

  <main>
    <section id="login" class="card stack" hidden>
      <div>
        <strong>Connect your put.io account</strong>
        <p class="muted small" style="margin:6px 0 0">This app keeps your place in every file and shares it with put.io, so the web player and the Apple app pick up where you stopped.</p>
      </div>
      <form id="connect-form" class="stack">
        <label for="client-input" class="small muted">put.io app client ID</label>
        <input id="client-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" required>
        <button class="primary" type="submit">Connect with put.io</button>
        <p class="small muted" style="margin:0">In your put.io app settings (app.put.io/oauth), set the callback URL to exactly:<br><code id="redir" style="overflow-wrap:anywhere"></code></p>
      </form>
      <hr style="border:0;border-top:1px solid var(--line);width:100%;margin:0">
      <form id="login-form" class="stack">
        <label for="token-input" class="small muted">Or paste an OAuth token instead</label>
        <input id="token-input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
        <button type="submit">Use token</button>
        <div id="login-msg" class="small err" role="alert"></div>
      </form>
    </section>

    <section id="browser" hidden>
      <nav id="crumbs" class="crumbs" aria-label="Folder path"></nav>
      <div id="list" class="list" aria-live="polite"></div>
    </section>

    <section id="player" hidden>
      <video id="video" controls playsinline preload="metadata"></video>
      <div id="ptitle" class="ptitle"></div>
      <div class="actions">
        <button id="restart">Start over</button>
        <a id="download" class="btn" href="#" rel="noopener">Download</a>
        <button id="vlc" hidden>Open in VLC</button>
        <button id="mp4" hidden>Switch format</button>
        <label class="toggle small"><input type="checkbox" id="autoplay"> Auto-start</label>
        <span id="ver" class="small muted" style="align-self:center;margin-left:auto"></span>
      </div>
      <div id="subs" class="actions" hidden>
        <label for="subsel" class="small muted" style="align-self:center">Subtitles</label>
        <select id="subsel" class="subsel"></select>
        <button id="subdl">Download .srt</button>
      </div>
      <div id="status" class="status" role="status"></div>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
